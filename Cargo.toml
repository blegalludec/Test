[package]
name = "silverblue-fleet"
version = "0.1.0"
edition = "2021"
description = "Administration d'un parc de postes Fedora Silverblue (GTK 4 / libadwaita)"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-channel = "2"
dirs = "5"

[profile.release]
lto = true
strip = true
